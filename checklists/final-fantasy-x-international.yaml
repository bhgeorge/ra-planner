slug: final-fantasy-x-international
title: "Final Fantasy X: International"
raGameId: 2778
console: PS2
version: 1
sources:
  - title: Item guide
    url: "https://docs.google.com/spreadsheets/d/1buOeKgsLZwGX68Yi18vJIMEKTI-DSDGc7UudAW9c3WE/edit?gid=0#gid=0"
  - title: Al Bhed primer locations
    url: "https://jegged.com/Games/Final-Fantasy-X/Side-Quests/Al-Bhed-Primer-Locations.html"
  - title: Via Purifico chest video guide (Christian Nightingale)
    url: "https://www.youtube.com/watch?v=lj5oMrcnA4E"
  - title: Sin chest video guide (Christian Nightingale)
    url: "https://www.youtube.com/watch?v=hUZeN99gMik"

chapters:
  - id: ch-dream-zanarkand
    title: Dream Zanarkand
    summary: Before entering the Blitzball arena
    steps:
      - id: s-bdsrqa
        text: Potion x2
        location: Zanarkand - Passway
        note: "Soon after controlling Tidus, before entering the Stadium.Talk with the woman running in pink clothes 3 times. Say: 'Sure thing'"
  - id: ch-baaj-temple-ruins
    title: Baaj Temple Ruins
    summary: Before lighting the fire
    steps:
      - id: s-4weafa
        text: 200 Gil
        location: Submerged Ruins
        note: Swim to the Right Side. On the small platform.
      - id: s-9hm8sb
        text: Potion x2
        location: Submerged Ruins
        note: Swim to the left side, past the Al Bhed Sphere.
      - id: s-cdqtbp
        text: Hi-Potion
        location: Ruins - Underwater Hall
        note: Run to the left side before the bridge falls.
      - id: s-d6df4k
        text: X-Potion
        location: Ruins - Hall
        note: Once in the campfire screen. One of the doors can't be opened, on the right from that door, is this chest.
      - id: s-mld23l
        text: Ether
        location: Ruins - Stairs
        note: From the campfire, transition to the North Area. Chest is on the South.
      - id: s-lfxr5k
        text: Hi-Potion
        location: Ruins - Hall (2nd Floor)
        note: From previous chest. Transition to the North Area. Follow to path to find the chest.
      - id: s-pxulkg
        text: Confirm Item Collector I (7)
  - id: ch-salvage-ship
    title: Salvage Ship
    summary: Before jumping into the water
    steps:
      - id: s-ilenna
        text: Al Bhed primer I
        note: Next to the save point.
  - id: ch-besaid-beach-first
    title: Besaid Beach
    summary: Before following Wakka to Besaid
    steps:
      - id: s-fizgke
        text: Moon Crest
        location: Besaid - Beach
        note: Once you get control of Tidus. Swim to the east, the chest is concealed on a small cove.
      - id: s-qlfdmv
        text: Antidote
        location: Besaid - Beach
        note: Running to the west, next to the wooden bridge.
      - id: s-gtkitn
        text: 200 Gil
        location: Besaid - Beach
        note: Before following Wakka - Talk to Keppa 2 times
      - id: s-vtnndq
        text: Potion x2
        location: Besaid - Beach
        note: Before following Wakka - Talk to Botta 2 times
      - id: s-zyz4hc
        text: Potion x3
        location: Besaid - Beach
        note: Before following Wakka - Talk to Jassu 2 times
      - id: s-sramyv
        text: Hi-Potion
        location: Besaid - Beach
        note: Before following Wakka - Talk to Datto 4 times
      - id: s-4y7s6b
        text: Phoenix Down
        location: Besaid - Valley
        note: Underwater - Right around the begining, if it's hard to spot, advance a bit and let the camera pan down for a bit, then come back.
      - id: s-imzwaw
        text: Hi-Potion
        location: Besaid - Valley
        note: Underwater - A bit past the previous chest, it's fairly hidden, on the left side.
      - id: s-loihmw
        text: Antidote x2
        location: Besaid - Valley
        note: Underwater - Right before the path that can only go north.
      - id: s-ttetrw
        text: Confirm Item Collector I (16)
  - id: ch-besaid-village
    title: Besaid Village
    summary: Before leaving the village for the beach
    steps:
      - id: s-9f1ece
        text: Phoenix Down
        location: Besaid - Village
        note: On the south-west tent, right in front of it.
      - id: s-7d48fc
        text: 400 Gil
        location: Besaid - Village
        note: "The hidden western path holds three chests; this is the first."
      - id: s-d4cfce
        text: Hi-Potion
        location: Besaid - Village
        note: Second chest on the same hidden western path.
      - id: s-c4d58c
        text: Potion x2
        location: Besaid - Village
        note: Third chest on the same hidden western path.
      - id: s-xxa4w
        text: Al Bhed Primer II
        location: Besaid - Village
        note: Inside the crusader's tent near the counter.
      - id: s-37dcbb
        text: Rod of Wisdom
        location: Besaid - Cloister of Trials
        note: Complete the secret trial using a destruction sphere. This mechanic repeats in every trial and ties into other achievements, so do not skip it. Counts toward Item Collector IV.
  - id: ch-besaid-departure
    title: Besaid Beach (departure)
    summary: Before boarding the boat
    steps:
      - id: s-279296
        text: Get Valefor's second overdrive
        location: Besaid - Village
        note: After the night scene, return to the village, talk to the item shop clerk, then the dog.
        achievementIds: [279296]
      - id: s-7a2f4d
        text: Ether
        location: Besaid - Beach
        note: "Let the NPCs gather on the bridge, then talk to each one several times; five treasures in total come from this group."
      - id: s-8dcc1a
        text: Phoenix Down x3
        location: Besaid - Beach
        note: Talk to the lady.
      - id: s-fa2f58
        text: Seeker Ring
        location: Besaid - Beach
        note: Talk to the priest.
      - id: s-98756c
        text: 400 Gil
        location: Besaid - Beach
        note: Talk to the villager at the top left.
      - id: s-459a93
        text: Remedy
        location: Besaid - Beach
        note: Talk to the kid at the bridge.
      - id: s-e26032
        text: Confirm Item Collector I (25)
  - id: ch-ss-liki
    title: SS Liki
    summary: Before the cutscenes on board
    steps:
      - id: s-1106e8
        text: Remedy
        location: SS Liki - Cabin
        note: "After taking control of Tidus, before any cutscenes. Go downstairs, and after the Oaka scene take the door on the left; the chest is on the west side. The suitcase with potions does not count."
      - id: s-artv4e
        text: Al Bhed Primer III
        location: SS Liki - Engine Room
        note: In the back near the chocobo.
  - id: ch-kilika-village
    title: Kilika Village
    summary: Before heading into the woods
    steps:
      - id: s-16f540
        text: Ether
        location: Kilika - Tavern
        note: "After the Yuna dance cutscene, run to the west of the village and save the little girl from the collapsing hut. Then go to the tavern in the east; she gives you the treasure."
      - id: yi7xnr
        text: Al Bhed Primer IV
        location: Kilika - Tavern
        note: On the counter.
      - id: s-20bc17
        text: Potion x3
        location: Kilika - House
        note: Inside the house in the north-west.
  - id: ch-kilika-woods
    title: Kilika Woods
    summary: Follow the Ochu steps in order. Several treasures depend on when and from which side you fight it.
    steps:
      - id: s-ef6089
        text: Antidote x4
        location: Kilika Woods
        note: Approach the Ochu from the south and talk to Luzzu 2 times. Do not defeat the Ochu yet.
      - id: s-9f2e9d
        text: Mana Sphere x2
        location: Kilika Woods
        note: Chest at the end of the south-east path.
      - id: s-4d3b1c
        text: Scout
        location: Kilika Woods
        note: From the save point go west, then north along the thin path to another chest.
      - id: s-f7200a
        text: Remedy
        location: Kilika Woods
        note: From the previous chest go north. At the intersection, talk to the blue-armored crusader 2 times.
      - id: s-e149e1
        text: Phoenix Down x3
        location: Kilika Woods
        note: Engage the Ochu from its west side, then flee. The crusader hands over the treasure. This one is a common cause of failed runs.
      - id: s-7f254e
        text: Hi-Potion
        location: Kilika Woods
        note: Continue north from the intersection, then east, and talk to the blue-armored crusader.
      - id: s-08cb86
        text: Luck Sphere
        location: Kilika Woods
        note: From the crusader, go north and follow the path.
      - id: s-0f2a58
        text: Elixir
        location: Kilika Woods
        note: Now defeat the Ochu from the south, then talk to Luzzu again.
  - id: ch-kilika-temple
    title: Kilika Temple
    summary: Cloister of Trials
    steps:
      - id: s-30c00e
        text: Red Armlet
        location: Kilika Temple - Cloister of Trials
        note: Complete the secret trial using a destruction sphere.
      - id: s-1df247
        text: Confirm Item Collector I (26), II (11), IV (1)
  - id: ch-ss-winno
    title: SS Winno
    summary: Before leaving the ship
    steps:
      - id: s-4e578c
        text: Hi-Potion
        location: SS Winno - Cabin
        note: On the screen where you first control Tidus, behind the Aurochs.
      - id: s-k7htnc
        text: Al Bhed Primer V
        location: SS Winno - Bridge
        note: On the ground next to the captain
      - id: s-279213
        text: Learn the Jecht Shot
        location: SS Winno - Deck
        achievementIds: [279213]
  - id: ch-luca
    title: Luca
    summary: "These chests do not currently count toward Item Collector II. Listed in case that gets fixed; if so, add 8 to the II count."
    steps:
      - id: s-hkueao
        text: Al Bhed Primer VI
        note: On the opposite side from the Auroch's locker room behind the two players on the left.
      - id: s-5xy1vq
        text: Al Bhed Primer VII
        location: Luca - Sphere Theater
        note: On the left side of the stairs.
      - id: s-bdeb36
        text: Hi-Potion x2
        location: Luca
        note: Optional. Does not currently count toward Item Collector II.
      - id: s-902a20
        text: 600 Gil
        location: Luca
        note: Optional. Does not currently count toward Item Collector II.
      - id: s-c3c570
        text: Tidal Spear
        location: Luca
        note: Optional. Does not currently count toward Item Collector II.
      - id: s-3da745
        text: Phoenix Down x2
        location: Luca
        note: Optional. Does not currently count toward Item Collector II.
      - id: s-d262c1
        text: Magic Sphere
        location: Luca
        note: Optional. Does not currently count toward Item Collector II.
      - id: s-3d3514
        text: HP Sphere
        location: Luca
        note: Optional. Does not currently count toward Item Collector II.
      - id: s-cf7784
        text: 1000 Gil
        location: Luca
        note: Optional. Does not currently count toward Item Collector II.
      - id: s-0695aa
        text: Strength Sphere
        location: Luca
        note: Optional. Does not currently count toward Item Collector II. Reward for winning the tournament.
  - id: ch-miihen-south-end
    title: Mi'ihen South End
    summary: "NPCs wander in and out of the area; keep track of who you have talked to before leaving."
    steps:
      - id: s-82200c
        text: Hi-Potion
        location: South End
        note: Talk to the first NPC in a yellow shirt.
      - id: s-35f12a
        text: Antidote x2
        location: South End
        note: Talk to the second NPC, a woman who likes to stand left of the statue near Maechen.
      - id: s-0a204b
        text: Hunter's Spear
        location: South End
        note: "Talk to the third NPC, in a blue shirt; they may show up sooner or later on the screen."
      - id: s-c81c03
        text: Ice Brand
        location: South End
        note: Chest behind the ruins on the left.
  - id: ch-miihen-highroad
    title: Mi'ihen Highroad (South and Central)
    summary: "Crusaders walk the road; talk to each of them before moving on."
    steps:
      - id: s-458eee
        text: Remedy
        location: Highroad South
        note: Right at the start, toward the west side.
      - id: s-3ed7c2
        text: Red Ring
        location: Highroad South
        note: "Talk to the dashing crusader in blue armor; you can wait for him at the south spawn point. A green soldier may also give this item."
      - id: s-68b03f
        text: Soft x3
        location: Highroad South
        note: "Do not kick the blitzball; talk to the boy past the ball instead. If you kicked it by accident, leave the screen and return. If he still won't give the item, reload your last save."
      - id: s-279217
        text: Defeat Belgemine's Ifrit in a duel
        location: Highroad South
        note: No Shield. Start with an overdrive. This is needed to make her appear later.
        achievementIds: [279217, 279218]
      - id: s-38780d
        text: Lv 1 Sphere
        location: Highroad Central
        note: "Talk to the crusader in blue armor; wait for him at the south spawn point."
      - id: s-eced14
        text: Antidote x4
        location: Highroad Central
        note: Talk to the crusader in yellow armor, who tends to walk the southern part.
      - id: s-b1c312
        text: 600 Gil
        location: Highroad Central
        note: Talk to the other yellow-armored crusader, toward the middle.
      - id: s-a421c6
        text: 2000 Gil
        location: Highroad Central
        note: Chest around the middle, next to some ruins on the east.
      - id: s-e01c8a
        text: Ether
        location: Highroad Central
        note: Talk to the purple crusader on the west side of the road. Does not count toward Item Collector, but grab it in case that gets fixed.
      - id: s-54fa72
        text: Hi-Potion
        location: Highroad Central
        note: After the Luzzu and Gatta cutscene, talk to the woman on the west side of the road.
      - id: s-766360
        text: Eye Drops x3
        location: Highroad Central
        note: Chest at the end of the road.
  - id: ch-miihen-chocobo-roads
    title: Mi'ihen Highroad (Chocobo roads)
    summary: From the Travel Agency north. Ride a chocobo and check the yellow feathers to reveal the chests.
    steps:
      - id: s-pkh5ru
        text: Al Bhed Primer VIII
        location: Mi'ihen Highroad - Travel Agency
        note: Given to you automatically by Rin when you reach the agency.
      - id: s-4bf64d
        text: Defeat the Chocobo Eater
        location: Mi'ihen Travel Agency
        note: This unlocks chocobos. You can lose by getting pushed down the cliff, so be careful.
        achievementIds: [279219]
      - id: s-09faab
        text: Heat Lance
        location: Highroad - New Road, North
        note: On a chocobo, around the middle of the road, check the yellow feather on the ground to reveal the chest.
      - id: s-o6krk
        text: Al Bhed Primer IX
        location: Highroad - New Road, North
        note: On the trail near two plants at the end of the location.
      - id: s-c56b61
        text: Hi-Potion x2
        location: Highroad - North End
        note: Toward the west side of the area.
      - id: s-69ecb4
        text: Thunder Blade
        location: Highroad - Old Road, North
        note: On a chocobo, inspect the yellow feathers along the path. This spot gives two items.
      - id: s-6c3541
        text: Scout
        location: Highroad - Old Road, North
        note: Second item from the same feather spot.
      - id: s-fd5622
        text: Fortune Sphere
        location: Highroad - Old Road, South
        note: "On a chocobo, follow the path south; another yellow feather reveals the chest."
      - id: s-e32411
        text: Saturn Crest
        location: Highroad - Old Road, South
        note: All the way to the end of the path.
  - id: ch-mushroom-rock
    title: Mushroom Rock
    summary: Before moving on to the valley
    steps:
      - id: s-9ae7c0
        text: Tough Bangle
        location: Mushroom Rock
        note: After the Seymour cutscene, backtrack a bit and talk to the crusader in the south. Does not count toward Item Collector II, but take it in case that gets fixed.
      - id: s-3b5b44
        text: Remedy
        location: Mushroom Rock
        note: "Next to the guard who gave the Tough Bangle. Also does not count; take it anyway."
      - id: s-2819e5
        text: Hi-Potion
        location: Mushroom Rock
        note: "Three crusaders gather after a while at the spot marked on the map. Wait for them; each one has an item."
      - id: s-6cc944
        text: Ether
        location: Mushroom Rock
        note: Second of the three gathered crusaders.
      - id: s-df69c5
        text: Phoenix Down x2
        location: Mushroom Rock
        note: Third of the three gathered crusaders.
  - id: ch-mushroom-valley
    title: Mushroom Rock - Valley
    summary: Before leaving the valley
    steps:
      - id: s-ca9bf3
        text: Hi-Potion
        location: Mushroom Rock - Valley
        note: Talk to the first guard you see.
      - id: s-bcdce9
        text: 1000 Gil
        location: Mushroom Rock - Valley
        note: Chest along the southern part, next to a crusader.
      - id: s-930747
        text: Potion x10
        location: Mushroom Rock - Valley
        note: Talk to the same guard as for the chest above. Does not count toward Item Collector.
      - id: s-670570
        text: Remedy
        location: Mushroom Rock - Valley
        note: Chest around the middle of the area.
      - id: s-1e1ae6
        text: Hi-Potion
        location: Mushroom Rock - Valley
        note: Chest near the end of the area.
      - id: s-g6grfh
        text: Al Bhed Primer X
        location: Mushroom Rock - Valley
        note: Along the secret pathway on the western side of the map.
  - id: ch-mushroom-precipice
    title: Mushroom Rock - Precipice
    summary: Before taking the final elevator
    steps:
      - id: s-060693
        text: X-Potion
        location: Mushroom Rock - Precipice
        note: Talk to the first guard you see. Does not count toward Item Collector.
      - id: s-db4008
        text: 400 Gil
        location: Mushroom Rock - Precipice
        note: Talk to the second guard you see.
      - id: s-6d1f19
        text: Serene Armlet
        location: Mushroom Rock - Precipice
        note: "Take the elevator on the west; the chest is down there."
      - id: s-9b92f0
        text: Mega-Potion
        location: Mushroom Rock - Precipice
        note: Near the end, in front of the final elevator, a crusader has this item.
  - id: ch-mushroom-ridge
    title: Mushroom Rock - Ridge
    summary: Cutscenes and both boss battles. The last chest only appears afterward.
    steps:
      - id: s-e3a336
        text: Mega-Potion
        location: Mushroom Rock - Ridge
        note: "After the Kinoc cutscenes, two chests sit next to Lulu and Yuna; this is the first."
      - id: s-8cd452
        text: Serene Bracer
        location: Mushroom Rock - Ridge
        note: Second chest next to Lulu and Yuna.
      - id: s-ac4474
        text: Hi-Potion
        location: Mushroom Rock - Aftermath
        note: After both boss battles and the Luzzu and Gatta cutscenes, go west from the save point to find the chest.
  - id: ch-djose-highroad
    title: Djose Highroad
    summary: Before entering the temple
    steps:
      - id: s-540d15
        text: Soft Ring
        location: Djose Highroad
        note: Talk to the first crusader walking north, wearing a yellow shirt.
      - id: s-44fbf6
        text: Phoenix Down x2
        location: Djose Highroad
        note: Chest on the southern part of the path.
      - id: s-d9ae0c
        text: Ether
        location: Djose Highroad
        note: Talk to the yellow crusader around the middle of the path, a bit past the Al Bhed Primer.
      - id: s-c9ebdf
        text: Hi-Potion
        location: Djose Highroad
        note: Talk to the priest next to the previous crusader.
      - id: s-75bf2d
        text: Bright Bangle
        location: Djose Highroad
        note: Chest semi-hidden on the west side.
      - id: s-cb694d
        text: Mega-Potion
        location: Djose Highroad
        note: Toward the end of the path, a praying crusader gives this.
      - id: s-b20401
        text: Variable Steel
        location: Djose Highroad
        note: "Backtrack to the start of the screen; a crusader in a blue shirt is there now. Talk to him 2 times."
      - id: s-jhr1ou
        text: Al Bhed Primer XI
        location: Djose Highroad
        note: Behind a pillar on the right side of the map.
  - id: ch-djose-temple
    title: Djose Temple
    summary: Before receiving Ixion
    steps:
      - id: s-3f6616
        text: 4000 Gil
        location: Djose Temple (Exterior)
        note: After the cutscenes outside the temple, on the west side, next to Lucil.
      - id: s-e74ed1
        text: Ability Sphere x4
        location: Djose Temple (Exterior)
        note: North-east of the save point.
      - id: s-168f08
        text: Ether
        location: Djose Temple - Great Hall
        note: Chest in the main hall, hidden in a corner of the north wing.
      - id: s-139192
        text: Remedy
        location: Djose Temple - Nun's Chamber
        note: Inside the north room.
      - id: s-20870d
        text: Mega Phoenix
        location: Djose Temple - Monk's Chamber
        note: Inside the south room.
      - id: s-b3f39f
        text: Magic Sphere
        location: Djose Temple - Cloister of Trials
        note: Complete the secret trial using a destruction sphere.
  - id: ch-djose-departure
    title: Djose Temple (departing)
    summary: After receiving Ixion. The pilgrimage road NPCs are missable.
    steps:
      - id: s-1b7de3
        text: Switch Hitter
        location: Djose Temple - Inn
        note: "Once you have Ixion, go into the inn; a chest behind the counter is now accessible."
      - id: s-9613ec
        text: Halberd
        location: Djose - Pilgrimage road
        note: On leaving the temple, talk to the first purple crusader.
      - id: s-4c024e
        text: Hi-Potion x2
        location: Djose - Pilgrimage road
        note: Talk to the priest.
      - id: s-00d911
        text: Potion x10
        location: Djose - Pilgrimage road
        note: At the end of the bridge, a blue crusader gives this.
      - id: s-e80842
        text: Confirm Item Collector I (26), II (60), IV (2)
  - id: ch-moonflow
    title: Moonflow
    summary: South bank to Guadosalam
    steps:
      - id: s-0e5a29
        text: Lv 1 Key Sphere x3
        location: South Bank Road
        note: Chest near the start, on a small side path.
      - id: s-90ff34
        text: X-Potion
        location: South Bank Road
        note: Chest next to Biran and Yenke.
      - id: s-7183bb
        text: Lv 1 Key Sphere x3
        location: South Bank Road
        note: Following the path, before Belgemine, on a small hidden side path.
      - id: s-d9bd0c
        text: Magic Def Sphere
        location: South Bank Road
        note: At the end of the path, on a west side path.
      - id: s-279226
        text: Defeat Belgemine's Ixion
        location: South Bank Road
        note: No Aeon deaths. Grand summon Ifrit, heal with Fire, overdrive x2. This is needed to make her appear later.
        achievementIds: [279225, 279226]
      - id: s-65b787
        text: Phoenix Down x2
        location: South Wharf
        note: Next to Oaka.
      - id: s-4238d1
        text: 5000 Gil
        location: South Wharf
        note: After the Lucil scene, chest next to Lulu.
      - id: s-96nwmh
        text: Al Bhed Primer XII
        location: North Wharf
        note: After defeating the Extractor, up the ramp on the platform.
      - id: s-bcdb25
        text: Ether
        location: North Wharf
        note: After defeating the Extractor, transition two areas west. The chest is next to the bank.
      - id: s-b13256
        text: Antidote x4
        location: North Bank
        note: After Rikku joins, the first chest you see on the path.
      - id: s-740df5
        text: Mega-Potion
        location: North Bank Road
        note: In the next area, before entering Guadosalam.
  - id: ch-guadosalam
    title: Guadosalam
    summary: The Seymour manor chest is a one-time chance.
    steps:
      - id: s-4c4961
        text: Mega-Potion
        location: Guadosalam
        note: Next to Seymour's Manor.
      - id: s-936672
        text: 3000 Gil
        location: Guadosalam - Left House
        note: In the house at the west, behind a pillar. Very hidden.
      - id: s-54lizn
        text: Al Bhed Primer XIII
        note: In a house on the ground just to the left of a central tree pillar.
      - id: s-ff716b
        text: Elixir
        location: Guadosalam
        note: From the previous house, walk south past 2 NPCs.
      - id: s-7a00f7
        text: Hi-Potion x2
        location: Guadosalam - Seymour Manor
        note: "You only get one chance. After entering the manor, climb the stairs; the chest is on the second floor."
      - id: s-557c8a
        text: Lightning Marble x8
        location: Road to Farplane
